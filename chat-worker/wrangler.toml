# Cloudflare Worker for the portfolio's "Ask about me" widget. Free plan: see README.md for the limits.
name = "ask-ivanka"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Workers AI: runs the model on Cloudflare's free daily allowance. No API key to manage.
[ai]
binding = "AI"

[vars]
# Where the knowledge comes from: the site publishes /assistant-knowledge.json on every build.
SITE_URL = "https://portfolio-d79q.onrender.com"
# Only these pages may call the worker (comma-separated). Add http://localhost:4321 to test locally.
ALLOWED_ORIGINS = "https://portfolio-d79q.onrender.com"
# Any text-generation model from https://developers.cloudflare.com/workers-ai/models/
MODEL = "@cf/meta/llama-3.1-8b-instruct"
